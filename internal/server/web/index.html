<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watchlist Tool</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><strong>WATCHLIST</strong><span>COMMAND BOARD</span></div><form id="addForm"><input id="symbolInput" maxlength="15" placeholder="ADD TICKER" autocomplete="off" spellcheck="false"><select id="listSelect"></select><button>ADD ↵</button></form><div id="status" class="status"><i></i><span>STARTING</span></div><div id="tradingViewStatus" class="status" style="margin-left:0" title="TradingView Desktop integration"><i></i><span>TV CHECKING</span></div><button id="newList" class="secondary">+ LIST</button></header>
<main id="board"></main><div id="toast" role="status"></div>
<template id="listTemplate"><section class="watchlist"><div class="list-head"><span class="color"></span><input class="list-name" aria-label="Watchlist name"><strong class="count"></strong><button class="remove-list" title="Delete empty list">×</button></div><div class="columns"><span>SYMBOL</span><span>LAST</span><span>CHG</span><span>VOL · SINCE 04:00</span><span>DAY MAP · PRE / RTH / POST</span></div><div class="rows"></div></section></template>
<template id="rowTemplate"><article class="ticker" draggable="true"><button class="select"><strong class="symbol"></strong><small class="note"></small></button><button class="price select"></button><span class="change"></span><span class="volume"></span><div class="actions"><select class="move-to" title="Move ticker to another list" aria-label="Move ticker to another list"></select><button class="chart" title="Open Polygon chart in new tab" aria-label="Open Polygon chart in new tab">↗</button><button class="marketsurge" title="Open symbol in MarketSurge" aria-label="Open symbol in MarketSurge">MS</button><button class="up" title="Move up">↑</button><button class="down" title="Move down">↓</button><button class="delete" title="Remove">×</button></div><section class="day-context" aria-label="Intraday price context"><header><strong>DAY MAP</strong><span class="map-session">09:30–16:00 ET</span><output class="map-change">--</output></header><canvas class="map"></canvas><footer><span>H <b class="map-high">--</b></span><span class="map-position">RANGE --</span><span>L <b class="map-low">--</b></span></footer></section></article></template>
<script src="app.js"></script><script src="tradingview-status.js"></script></body></html>
